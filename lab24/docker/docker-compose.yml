version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - PORT=3000
      - WS_PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/bbmo_01_23
      - DB_NAME=bbmo_01_23
      - JWT_SECRET=supersecretjwtkey_bbmo_01_23
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=bbmo_01_23
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
